name: Actualizare IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca fisierele
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Genereaza lista IPTV
        run: python OTTPlayer_RU_RO_MD/combine.py

      - name: Salveaza lista
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OTTPlayer_RU_RO_MD/playlist.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Actualizare lista IPTV"
            git push
          fi
